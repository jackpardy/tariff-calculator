name: Test and deploy

on:
  push:
    branches: [master]
  # Pull requests run the tests only; nothing deploys from them.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One test run per branch or PR; a newer push to a PR cancels its older run.
# Deploys have their own group (below), so a PR never holds one up.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Only documents changed (knowledge/, docs/, Markdown, the guide's PDFs):
  # nothing to build, test or deploy.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: What changed
        id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE...HEAD")
          code=$(printf '%s\n' "$files" | grep -vE '^(knowledge/|docs/)|\.md$|\.pdf$' | grep -c . || true)
          if [ "$code" = "0" ]; then
            echo "::notice::Only documents changed; skipping the build, tests and deploy."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # The tests. It always runs and reports, as "test" is a required check;
  # for documents alone its steps are skipped.
  test:
    needs: changes
    runs-on: ubuntu-latest
    env:
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        if: env.CODE == 'true'
      - uses: actions/setup-go@v7
        if: env.CODE == 'true'
        with:
          go-version-file: go.mod
      - name: Check generated templ code is up to date
        if: env.CODE == 'true'
        run: |
          go tool templ generate
          git diff --exit-code -- '*_templ.go' || {
            echo "::error::Generated templ code is stale; run 'go tool templ generate' and commit."
            exit 1
          }
      - run: go vet ./...
        if: env.CODE == 'true'
      - run: go test ./...
        if: env.CODE == 'true'
      - name: Known vulnerabilities in the code's dependencies and Go
        if: env.CODE == 'true'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  # The Docker image, built beside the tests rather than after them, with its
  # layers cached between runs. On master it's kept for the deploy, which
  # sends it to the server, so the server doesn't build it again.
  image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: tariff:local
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Keep the image for the deploy
        if: github.event_name != 'pull_request'
        run: docker save tariff:local | gzip -1 > tariff-image.tar.gz
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: tariff-image
          path: tariff-image.tar.gz
          retention-days: 1
          compression-level: 0

  deploy:
    needs: [changes, test, image]
    if: github.event_name != 'pull_request' && needs.changes.outputs.code == 'true'
    concurrency: deploy-tariff
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tariff-image
      - name: Deploy over SSH
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::DEPLOY_HOST secret is empty; skipping deploy."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Server forces /srv/infra/scripts/deploy.sh tariff. Asked for
          # "load-image", it loads the image sent here (CI built it) rather
          # than building one; the command text is only ever compared, never run.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" load-image < tariff-image.tar.gz
      - name: Check the deployed app is healthy
        run: |
          if [ -z "$DEPLOY_HOST" ]; then exit 0; fi
          # /healthz fails when competition storage didn't open (a migration
          # that failed, say), though the calculator still works.
          for i in $(seq 1 12); do
            if curl -fsS https://tariff.pardy.ie/healthz; then exit 0; fi
            sleep 10
          done
          echo "::error::https://tariff.pardy.ie/healthz isn't healthy two minutes after deploying; check the app's log."
          exit 1
