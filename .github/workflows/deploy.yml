name: Test and deploy

on:
  push:
    branches: [master]
  # Pull requests run the tests only; nothing deploys from them.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One test run per branch or PR; a newer push to a PR cancels its older run.
# Deploys have their own group (below), so a PR never holds one up.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check generated templ code is up to date
        run: |
          go tool templ generate
          git diff --exit-code -- '*_templ.go' || {
            echo "::error::Generated templ code is stale; run 'go tool templ generate' and commit."
            exit 1
          }
      - run: go vet ./...
      - run: go test ./...
      - name: Build the Docker image
        run: docker build -t tariff-calculator:ci .

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    concurrency: deploy-tariff
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Deploy over SSH
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::DEPLOY_HOST secret is empty; skipping deploy."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Server forces /srv/infra/scripts/deploy.sh tariff; the command text is ignored.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" deploy
